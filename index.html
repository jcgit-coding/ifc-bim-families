<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Familias BIM · Generador IFC</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<header>
  <strong>Familias BIM</strong><span>Generador paramétrico de IFC4</span>
</header>
<div class="layout">
  <nav id="catalog" aria-label="Plantillas"></nav>
  <aside class="panel">
    <div id="form"></div>
    <div id="err" role="alert"></div>
    <div id="warn"></div>
  </aside>
  <section class="stage">
    <div id="viewer"></div>
    <div class="bar">
      <div class="views">
        <button data-view="iso" type="button">Isométrica</button>
        <button data-view="planta" type="button">Planta</button>
        <button data-view="frontal" type="button">Frontal</button>
        <button data-view="lateral" type="button">Lateral</button>
      </div>
      <span id="info"></span>
    </div>
    <div class="actions">
      <button id="dl" class="primary" type="button">Descargar IFC</button>
      <button id="json" type="button">Parámetros (JSON)</button>
      <button id="share" type="button">Copiar enlace</button>
    </div>
  </section>
</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
